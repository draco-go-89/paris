<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Unavailable</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6fbff;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 390px;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            border-radius: 50%;
            color: #374151;
        }

        .icon svg {
            width: 29px;
            height: 29px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 27px;
            font-weight: 650;
            letter-spacing: -0.8px;
            line-height: 1.3;
        }

        .description {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.8;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 25px 0 28px;
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #f59e0b;
            border-radius: 50%;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #374151;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 22px;
            color: #9ca3af;
            font-size: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
            </svg>
        </div>

        <h1>Temporarily Unavailable</h1>

        <p class="description">
            This website is under development. Developer is so lazy,  Thank you for your patience..
        </p>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Development in progress</span>
        </div>

        <button onclick="goBack()">OKAY</button>

        <p class="footer" id="footerText">
            We appreciate your patience.
        </p>

    </main>

    <script>
        // Set your maintenance schedule using local time.
        const maintenanceStart = new Date("2026-10-29T21:00:00");
        const maintenanceEnd = new Date("2026-11-03T09:00:00");

        const now = new Date();
        const statusText = document.getElementById("statusText");
        const footerText = document.getElementById("footerText");

        if (now < maintenanceStart) {
            statusText.textContent = "Scheduled maintenance";
            footerText.textContent =
                "Maintenance begins at " +
                maintenanceStart.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
        } else if (now < maintenanceEnd) {
            statusText.textContent = "Development in progress";
            footerText.textContent =
                "Availability: 03 Nov " +
                maintenanceEnd.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
        } else {
            statusText.textContent = "Maintenance window ended";
            footerText.textContent =
                "Please refresh or try again shortly.";
        }

        function goBack() {
            if (history.length > 1) {
                history.back();
            } else {
                window.location.href = "/";
            }
        }
    </script>

</body>

</html>
